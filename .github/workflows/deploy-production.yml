name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            eduai/api:latest
            eduai/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            eduai/web:latest
            eduai/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          kubectl run prisma-migrate-${{ github.run_id }} \
            --image=eduai/api:${{ needs.build-and-push.outputs.image_tag }} \
            --namespace=eduai \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- npx prisma migrate deploy
          kubectl wait \
            --for=condition=complete \
            pod/prisma-migrate-${{ github.run_id }} \
            --timeout=180s \
            -n eduai
          kubectl delete pod prisma-migrate-${{ github.run_id }} -n eduai

      - name: Deploy API
        run: |
          kubectl set image deployment/eduai-api \
            api=eduai/api:${{ needs.build-and-push.outputs.image_tag }} \
            -n eduai
          kubectl rollout status deployment/eduai-api -n eduai --timeout=5m

      - name: Deploy Web
        run: |
          kubectl set image deployment/eduai-web \
            web=eduai/web:${{ needs.build-and-push.outputs.image_tag }} \
            -n eduai
          kubectl rollout status deployment/eduai-web -n eduai --timeout=5m

      - name: Verify deployment health
        run: |
          kubectl get pods -n eduai -l app.kubernetes.io/part-of=eduai
          echo "All pods:"
          kubectl get pods -n eduai

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"✅ EduAI deployed to production — commit ${{ github.sha }} by ${{ github.actor }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — rolling back..."
          kubectl rollout undo deployment/eduai-api -n eduai || true
          kubectl rollout undo deployment/eduai-web -n eduai || true

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"🚨 EduAI production deployment FAILED for commit ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
