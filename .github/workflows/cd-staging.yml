name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: eduai-staging
  NAMESPACE: eduai-staging

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/eduai-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/eduai-api:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/eduai-web:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/eduai-web:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run database migrations
        run: |
          kubectl run prisma-migrate-${{ github.run_id }} \
            --image=${{ env.ECR_REGISTRY }}/eduai-api:${{ needs.build-and-push.outputs.image_tag }} \
            --namespace=${{ env.NAMESPACE }} \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" \
            --command -- npx prisma migrate deploy
          kubectl wait --for=condition=completed pod/prisma-migrate-${{ github.run_id }} --timeout=120s -n ${{ env.NAMESPACE }}
          kubectl delete pod prisma-migrate-${{ github.run_id }} -n ${{ env.NAMESPACE }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install eduai-staging infra/helm/eduai \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values infra/helm/eduai/values.yaml \
            --set api.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set web.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set api.image.repository=${{ env.ECR_REGISTRY }}/eduai-api \
            --set web.image.repository=${{ env.ECR_REGISTRY }}/eduai-web \
            --wait --timeout=10m

      - name: Smoke test
        run: |
          HEALTH=$(kubectl run smoke-test-${{ github.run_id }} \
            --image=curlimages/curl:latest \
            --namespace=${{ env.NAMESPACE }} \
            --restart=Never \
            --rm -it \
            -- curl -s -o /dev/null -w "%{http_code}" https://api-staging.eduai.io/health/ping)
          echo "Health check status: $HEALTH"
          if [ "$HEALTH" != "200" ]; then exit 1; fi
