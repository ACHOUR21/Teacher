name: Security Scan

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit API dependencies
        run: pnpm --filter @eduai/api audit --audit-level=high
        continue-on-error: true

      - name: Audit Web dependencies
        run: pnpm --filter @eduai/web audit --audit-level=high
        continue-on-error: true

      - name: Audit all workspace packages
        run: pnpm audit --audit-level=high
        continue-on-error: true

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  docker-image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: api, file: infra/docker/api.Dockerfile }
          - { name: web, file: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: false
          load: true
          tags: eduai/${{ matrix.image.name }}:scan
        continue-on-error: true

      - name: Scan ${{ matrix.image.name }} image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: eduai/${{ matrix.image.name }}:scan
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
        continue-on-error: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  notify-results:
    name: Notify Security Results
    runs-on: ubuntu-latest
    needs: [dependency-audit, trivy-scan, docker-image-scan, secret-scan]
    if: always()
    steps:
      - name: Post Slack summary
        uses: slackapi/slack-github-action@v1
        with:
          payload: >
            {
              "text": "🔒 Weekly security scan completed for EduAI.\nDependency audit: ${{ needs.dependency-audit.result }}\nTrivy scan: ${{ needs.trivy-scan.result }}\nDocker scan: ${{ needs.docker-image-scan.result }}\nSecret scan: ${{ needs.secret-scan.result }}\nDetails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
