name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, claude/claude-md-docs-y0hdj]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm --filter @eduai/shared build
      - run: pnpm --filter @eduai/ai build
      - run: pnpm --filter @eduai/api prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: pnpm --filter @eduai/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduai
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eduai_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eduai/shared build
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://eduai:password@localhost:5432/eduai_test
      - name: Run migrations
        working-directory: apps/api
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eduai:password@localhost:5432/eduai_test
      - name: Run tests
        run: pnpm --filter @eduai/api test -- --coverage
        env:
          DATABASE_URL: postgresql://eduai:password@localhost:5432/eduai_test
          DIRECT_URL: postgresql://eduai:password@localhost:5432/eduai_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-64-chars-long-for-testing-only-xyzabc
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-64-chars-for-testing-purposes-xyzabc
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          NODE_ENV: test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduai
          POSTGRES_PASSWORD: password
          POSTGRES_DB: eduai_e2e
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Setup API
        working-directory: apps/api
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://eduai:password@localhost:5432/eduai_e2e
      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API server
        working-directory: apps/api
        run: pnpm start &
        env:
          DATABASE_URL: postgresql://eduai:password@localhost:5432/eduai_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-secret-that-is-at-least-64-chars-long-for-testing-only-xyzabc
          JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-64-chars-for-testing-purposes-xyzabc
          NODE_ENV: test
          PORT: 4000
      - name: Wait for API
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 30000
      - name: Start Web server
        working-directory: apps/web
        run: pnpm build && pnpm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          PORT: 3000
      - name: Wait for Web
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Run Playwright tests
        working-directory: apps/web
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
        continue-on-error: true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/claude-md-docs-y0hdj'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: eduai-api:ci
      - name: Build Web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          target: runner
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: eduai-web:ci

