{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eduai.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eduai.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eduai.worker.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "eduai.worker.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "eduai.serviceAccountName" . }}-worker
      # Allow long-running jobs to finish before pod is killed
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: {{ include "eduai.image" (dict "image" .Values.worker.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: WORKER_QUEUES
              value: {{ .Values.worker.queues | quote }}
            {{- include "eduai.envVars" .Values.worker.env | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "eduai.fullname" . }}-config
            - secretRef:
                name: eduai-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('fs').accessSync('/tmp/worker-healthy')"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "eduai.worker.selectorLabels" . | nindent 14 }}
{{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eduai.serviceAccountName" . }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eduai.worker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.worker.enabled .Values.podDisruptionBudget.worker.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eduai.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "eduai.worker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.worker.minAvailable }}
  selector:
    matchLabels:
      {{- include "eduai.worker.selectorLabels" . | nindent 6 }}
{{- end }}
