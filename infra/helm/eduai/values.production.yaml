# Production overrides — merged on top of values.yaml
# Deploy with: helm upgrade --install eduai . -f values.yaml -f values.production.yaml

api:
  replicaCount: 3

  image:
    pullPolicy: Always

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

web:
  replicaCount: 3

  image:
    pullPolicy: Always

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 3

  image:
    pullPolicy: Always

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  env:
    WORKER_CONCURRENCY: "20"

config:
  logLevel: "warn"

podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 2
  web:
    enabled: true
    minAvailable: 2
  worker:
    enabled: true
    minAvailable: 1

externalSecrets:
  enabled: true
