version: '3.9'

# Development override for EduAI Ultimate
# Usage: docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml up
#
# This file overrides production settings for local development:
#   - No multi-stage builds — mounts source directories for hot reload
#   - Uses node:20-alpine image directly instead of built images
#   - Exposes additional debug ports

services:

  # ── API — hot reload via NestJS watch mode ────────────────────────────────────
  api:
    build: null
    image: node:20-alpine
    container_name: eduai_api_dev
    working_dir: /app
    command: sh -c "npm install -g pnpm@9 && pnpm install && pnpm run start:dev"
    volumes:
      - ../../apps/api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://eduai:password@postgres:5432/eduai_db
      DIRECT_URL: postgresql://eduai:password@postgres:5432/eduai_db
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: eduai
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: dev-jwt-secret-at-least-64-chars-long-for-local-dev-only-xyzabc123
      JWT_REFRESH_SECRET: dev-refresh-secret-at-least-64-chars-long-for-local-dev-xyzabc123
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:3001

  # ── Web — hot reload via Next.js dev server ───────────────────────────────────
  web:
    build: null
    image: node:20-alpine
    container_name: eduai_web_dev
    working_dir: /app
    command: sh -c "npm install -g pnpm@9 && pnpm install && pnpm run dev"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
