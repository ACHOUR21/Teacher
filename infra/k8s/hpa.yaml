---
# HorizontalPodAutoscaler — API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eduai-api-hpa
  namespace: eduai
  labels:
    app.kubernetes.io/name: eduai-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: eduai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eduai-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
---
# HorizontalPodAutoscaler — Web
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eduai-web-hpa
  namespace: eduai
  labels:
    app.kubernetes.io/name: eduai-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: eduai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eduai-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
