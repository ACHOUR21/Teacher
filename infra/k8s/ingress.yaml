apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eduai-ingress
  namespace: eduai
  labels:
    app.kubernetes.io/name: eduai-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: eduai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # cert-manager: automatically provision TLS certificates via Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NGINX settings
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  tls:
    - hosts:
        - api.eduai.io
      secretName: api-eduai-io-tls
    - hosts:
        - app.eduai.io
      secretName: app-eduai-io-tls
    - hosts:
        - "*.eduai.io"
      secretName: wildcard-eduai-io-tls
  rules:
    # API backend
    - host: api.eduai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduai-api
                port:
                  number: 4000
    # Main web app
    - host: app.eduai.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduai-web
                port:
                  number: 3000
    # Wildcard: multi-tenant subdomains (tenant.eduai.io) → web
    - host: "*.eduai.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eduai-web
                port:
                  number: 3000
---
# ClusterIssuer for Let's Encrypt (cert-manager required)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@eduai.io
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
