apiVersion: apps/v1
kind: Deployment
metadata:
  name: eduai-worker
  namespace: eduai
  labels:
    app.kubernetes.io/name: eduai-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: eduai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: eduai-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Allow zero unavailable to ensure at least 2 workers process queues
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eduai-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: eduai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/metrics"
    spec:
      # Long grace period — allow in-flight jobs to complete
      terminationGracePeriodSeconds: 120
      serviceAccountName: eduai-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: eduai/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: eduai-config
            - secretRef:
                name: eduai-secrets
          env:
            - name: WORKER_CONCURRENCY
              value: "10"
            - name: WORKER_QUEUES
              value: "email,notifications,ai-processing,video-processing,report-generation,certificate-generation"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('./dist/worker-health')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: eduai-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eduai-worker
  namespace: eduai
  labels:
    app.kubernetes.io/name: eduai-worker
    app.kubernetes.io/component: worker
