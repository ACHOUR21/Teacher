---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: eduai
spec:
  schedule: "30 2 * * *"   # 2:30 AM daily
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: redis-backup
              image: redis:7-alpine
              env:
                - name: REDIS_HOST
                  value: redis
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: eduai-secrets
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: eduai-secrets
                      key: S3_SECRET_KEY
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: eduai-config
                      key: S3_BUCKET
              command:
                - /bin/sh
                - -c
                - |
                  redis-cli -h ${REDIS_HOST} BGSAVE
                  sleep 5
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  apk add --no-cache aws-cli
                  aws s3 cp /data/dump.rdb s3://${S3_BUCKET}/backups/redis/dump_${TIMESTAMP}.rdb
                  echo "Redis backup complete"
