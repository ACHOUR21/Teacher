# Wildcard Certificate — *.eduai.example.com
#
# Uses DNS-01 challenge via AWS Route53.  DNS-01 is required for wildcard
# certificates because Let's Encrypt cannot verify HTTP-01 for *.domain.com.
#
# Prerequisites:
#   1. cert-manager installed in the cluster.
#   2. An IAM user / role with the following Route53 permissions:
#        route53:GetChange, route53:ChangeResourceRecordSets,
#        route53:ListHostedZonesByName
#   3. The Route53 hosted zone ID for eduai.example.com stored in:
#        kubectl -n cert-manager create secret generic route53-credentials \
#          --from-literal=secret-access-key=<AWS_SECRET_ACCESS_KEY>
#   4. AWS_ACCESS_KEY_ID set as an env var or via IRSA (preferred).

---
# DNS-01 ClusterIssuer for wildcard certs
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
  labels:
    app.kubernetes.io/name: letsencrypt-prod-dns01
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/part-of: eduai
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@eduai.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-dns01-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            # Hosted zone ID for eduai.example.com
            # Replace with your actual hosted zone ID from the AWS console
            hostedZoneID: REPLACE_WITH_HOSTED_ZONE_ID
            # AWS credentials for Route53 DNS record management
            # Use IRSA in production instead of static credentials
            accessKeyID: REPLACE_WITH_AWS_ACCESS_KEY_ID
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key

---
# Wildcard certificate for all tenant subdomains (*.eduai.example.com)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-eduai-example-com
  namespace: eduai
  labels:
    app.kubernetes.io/name: wildcard-cert
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/part-of: eduai
spec:
  # The TLS secret that will store the wildcard certificate
  secretName: wildcard-eduai-example-com-tls
  issuerRef:
    name: letsencrypt-prod-dns01
    kind: ClusterIssuer
  commonName: "*.eduai.example.com"
  dnsNames:
    - "*.eduai.example.com"
    - "eduai.example.com"
  # Renew 30 days before expiry
  renewBefore: 720h  # 30 days
  duration: 2160h     # 90 days (Let's Encrypt maximum)
  privateKey:
    algorithm: RSA
    size: 2048
