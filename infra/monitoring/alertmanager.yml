global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-localhost:587}'
  smtp_from: '${SMTP_FROM:-alerts@eduai.io}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASSWORD:-}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      continue: true

    - match:
        severity: warning
      receiver: warning

receivers:
  - name: default
    email_configs:
      - to: '${ALERT_EMAIL:-ops@eduai.io}'
        subject: '[EduAI] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          {{ end }}

  - name: critical
    email_configs:
      - to: '${CRITICAL_ALERT_EMAIL:-oncall@eduai.io}'
        subject: '[CRITICAL] [EduAI] {{ .GroupLabels.alertname }}'
        send_resolved: true

  - name: warning
    email_configs:
      - to: '${ALERT_EMAIL:-ops@eduai.io}'
        subject: '[WARNING] [EduAI] {{ .GroupLabels.alertname }}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
